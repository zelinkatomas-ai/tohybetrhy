name: Návrhy do Radaru

# Sobotní sběr týdne: stáhne RSS feedy a uloží návrhy zpráv do
# pipeline/sources_proposals.json (commituje se, ať jsou návrhy po ruce –
# v logu je nikdo nečetl a Radar zastarával). Kurátorský krok zůstává
# lidský: návrhy se ručně, nebo přes Claude s revizí v PR, přenášejí
# do src/config/sources.json.
on:
  schedule:
    - cron: "0 7 * * 6" # sobota ráno, po páteční aktualizaci dat
  workflow_dispatch: {}

jobs:
  navrhy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r pipeline/requirements.txt

      - name: Stažení feedů a výpis návrhů
        run: |
          python pipeline/fetch_sources.py
          echo "===== PLNÉ NÁVRHY (JSON) ====="
          cat pipeline/sources_proposals.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit návrhů
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add pipeline/sources_proposals.json pipeline/sources_seen.json
          git diff --cached --quiet || git commit -m "Návrhy do Radaru ($(date -u +%F))"
          git push
