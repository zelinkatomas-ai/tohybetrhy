name: Aktualizace dat

on:
  schedule:
    # Každý pátek v 18:00 UTC (po zavření evropských burz); cron běží v UTC
    - cron: "0 18 * * 5"
  workflow_dispatch: {} # ruční spuštění z GitHubu

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r pipeline/requirements.txt

      # DOČASNÁ diagnostika (větev claude/verify-insiders): ověření oprav
      - name: Diagnostika politici (NANC/KRUZ)
        run: |
          python - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("fd", "pipeline/fetch_data.py")
          fd = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fd)
          try:
              p = fd.fetch_politicians()
              print("POLITICI OK")
              print("  série:", [s["name"] for s in p["series"]])
              print("  since:", p["since"], "poslední hodnoty:", p["last"])
              print("  note:", p["note"])
          except Exception as e:
              print("POLITICI SELHALO:", repr(e))
          EOF
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"

      - name: Sken insiderů (ostrý běh)
        run: python pipeline/fetch_data.py --insiders
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit nových dat
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "Automatická aktualizace dat ($(date -u +%F))"
          git push
      # Push spustí build & deploy (Cloudflare Pages / Netlify napojené na repo).
