name: Aktualizace dat

on:
  schedule:
    # Každý pátek v 18:00 UTC (po zavření evropských burz); cron běží v UTC
    - cron: "0 18 * * 5"
  workflow_dispatch: {} # ruční spuštění z GitHubu

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r pipeline/requirements.txt

      - name: DOCASNE - diagnostika parsovani Wikipedie
        run: |
          python3 - <<'EOF'
          import re, requests
          HEADERS = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) tohybetrhy.cz data pipeline"}
          r = requests.get("https://en.wikipedia.org/wiki/List_of_S%26P_500_companies",
                           headers=HEADERS, timeout=30)
          print("status:", r.status_code, "len:", len(r.text))
          print("vyskyty id=constituents:", r.text.count('id="constituents"'))
          m = re.search(r'id="constituents".*?</table>', r.text, re.S)
          print("tabulka nalezena:", bool(m), "delka:", len(m.group(0)) if m else 0)
          if m:
              t = m.group(0)
              print("tr bez atributu:", len(re.findall(r"<tr>", t)))
              print("tr s atributy:", len(re.findall(r"<tr[^>]*>", t)))
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S)
              print("radku:", len(rows))
              for row in rows[1:3]:
                  cells = re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", row, re.S)
                  print("bunek:", len(cells), "| prvni 3:", [re.sub(r"<[^>]+>", "", c).strip()[:30] for c in cells[:3]])
          EOF
        env:
          PYTHONUNBUFFERED: "1"

      - name: Stažení dat a výpočet momenta
        run: python pipeline/fetch_data.py
        timeout-minutes: 15 # zamrzlý zdroj nesmí držet job hodiny (tahouni sektorů přidali ~3 min)
        env:
          PYTHONUNBUFFERED: "1" # průběžný výstup v logu (kvůli diagnostice)
          # Volitelný bezplatný klíč pro FRED API (záloha, když CSV endpoint
          # blokuje IP runneru): https://fred.stlouisfed.org/docs/api/api_key.html
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit nových dat
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "Automatická aktualizace dat ($(date -u +%F))"
          git push
      # Push spustí build & deploy (Cloudflare Pages / Netlify napojené na repo).
